# Example Nginx reverse proxy for a single VPS (TLS via certbot).
server {
  listen 80;
  server_name api.staffmint.app;
  location /.well-known/acme-challenge/ { root /var/www/certbot; }
  location / { return 301 https://$host$request_uri; }
}
server {
  listen 443 ssl http2;
  server_name api.staffmint.app;
  ssl_certificate     /etc/letsencrypt/live/api.staffmint.app/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/api.staffmint.app/privkey.pem;
  client_max_body_size 10m;
  location / {
    proxy_pass http://127.0.0.1:4000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
server {
  listen 443 ssl http2;
  server_name app.staffmint.app;
  ssl_certificate     /etc/letsencrypt/live/app.staffmint.app/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/app.staffmint.app/privkey.pem;
  location / { proxy_pass http://127.0.0.1:3000; proxy_set_header Host $host; }
}
